# XcodeGen spec for Hex Mobile Sync. Generate the project with `make project`
# (the .xcodeproj is not committed). Team and bundle ID prefix come from
# Config/Local.xcconfig (gitignored); see Config/Local.xcconfig.example.
name: HexMobile

options:
  bundleIdPrefix: io.github.hexmobile
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_PREVIEWS: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic

packages:
  LibrimeKit:
    url: https://github.com/zhanggenlove/LibrimeKit.git
    exactVersion: 0.1.0
  HexMobileCore:
    path: Packages/HexMobileCore
  # How the app asks WhisperKit for a text (decoding options, the cut of a long
  # recording into pieces), shared with tools/whisper-bench. App target only.
  HexMobileWhisper:
    path: Packages/HexMobileWhisper
  # WhisperKit (MIT), the second engine of the final pass. Linked by the app
  # only: the keyboard and widget extensions, the HexMobileCore package and
  # tools/asr-bench do not pull it. The repository was `argmaxinc/WhisperKit`
  # and now redirects here. Pinned to the exact tag (commit 1bbc57cb).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

targets:
  HexMobile:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: Design
      - path: App/Info.plist
        buildPhase: none
    dependencies:
      - package: HexMobileCore
      - package: HexMobileCore
        product: HexMobileSpeech
      - package: HexMobileWhisper
      - package: ArgmaxOSS
        product: WhisperKit
      - target: HexMobileWidgets
        embed: true
        codeSign: true
      - target: HexKeyboard
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: HexMobile
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).HexMobile
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HEXMOBILE_APP
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  HexMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
      - path: Widgets/Resources
      - path: Shared
      - path: Design
      - path: Widgets/Info.plist
        buildPhase: none
    dependencies:
      - package: HexMobileCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: HexMobileWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).HexMobile.Widgets
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  HexKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Keyboard/Resources
        excludes:
          - RimeData
      - path: Keyboard/Resources/RimeData
        type: folder
      - path: Design
      - path: Keyboard/Info.plist
        buildPhase: none
    dependencies:
      - package: HexMobileCore
      - package: LibrimeKit
      # Linked only so Xcode's App Intents metadata step runs cleanly for
      # this target (it otherwise warns that the framework is missing).
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: HexKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).HexMobile.Keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  HexMobile:
    build:
      targets:
        HexMobile: all
        HexMobileWidgets: all
        HexKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
